services:
  # ─── Redis ─────────────────────────────────
  # Redis here is a durable work queue, not a cache: the only keys are the
  # signal and alert lists, and every one of them is data that has been
  # accepted from a customer but not yet written to Postgres or delivered.
  #
  # allkeys-lru would evict those lists under memory pressure — and memory
  # pressure arrives exactly during a large outage, when many APIs fail at once
  # and the alert queue is at its longest. That would drop the alerts at the
  # moment they matter most, silently. noeviction instead makes a full Redis
  # refuse writes, which the ingest endpoint surfaces as a 503 and the worker
  # logs, so the failure is visible rather than invisible.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >-
      redis-server --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction

  # ─── Fastify Ingest Service ────────────────
  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - LOG_LEVEL=info
    depends_on:
      - redis

  # ─── Worker (Aggregation + Anomaly + Alerts) ─
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - ALERT_FROM_EMAIL=${ALERT_FROM_EMAIL:-alerts@apidown.net}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      - redis

volumes:
  redis_data:
